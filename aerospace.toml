config-version = 2

after-login-command = []

after-startup-command = [
    'exec-and-forget borders active_color=0x88FFFFFF inactive_color=0x00000000 width=10.0 hidpi=on style=round'
]

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 20

default-root-container-layout = 'tiles'

default-root-container-orientation = 'auto'

# on-focus-changed = ['move-mouse window-lazy-center']
# on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[workspace-to-monitor-force-assignment]
    1 = 'main'
    2 = 'main'
    3 = 'main'
    4 = 'main'
    5 = 'main'
    6 = 'main'
    7 = 'main'
    8 = 'secondary'
    9 = 'secondary'

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 20
    inner.vertical =  20
    outer.left =       16
    outer.bottom =     16
    outer.top =       16
    outer.right =     16

# Rules for specific windows
[[on-window-detected]]
  if.app-id = 'org.kicad.kicad' 
  if.window-title-regex-substring = 'KiCad \d+\.\d+' # Match titles ending like ' - KiCad 9.0'
  run = 'layout floating' 
  
[[on-window-detected]]
  if.app-id = 'org.kicad.kicad' 
  if.window-title-regex-substring = 'Assign Footprints' 
  run = 'layout floating' 

[[on-window-detected]]
  if.app-id = 'org.kicad.kicad' 
  if.window-title-regex-substring = 'Footprint Editor' 
  run = 'layout floating'

[[on-window-detected]]
  if.app-id = 'org.kicad.kicad' 
  if.window-title-regex-substring = 'Symbol Editor' 
  run = 'layout floating'

[[on-window-detected]]
  if.app-id = 'app.zen-browser.zen'
  if.window-title-regex-substring = 'Picture-in-Picture'
  run = ['layout floating']


[[on-window-detected]]
  if.app-id = 'com.apple.finder'
  run = ['layout floating']
[mode.main.binding]

    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    alt-f = 'fullscreen'

    alt-left = 'focus --boundaries all-monitors-outer-frame left'
    alt-down = 'focus down'
    alt-up = 'focus up'
    alt-right = 'focus --boundaries all-monitors-outer-frame right'

    alt-tab = 'focus-monitor --wrap-around next'

    alt-shift-left = 'move --boundaries all-monitors-outer-frame left'
    alt-shift-down = 'move down'
    alt-shift-up = 'move up'
    alt-shift-right = 'move --boundaries all-monitors-outer-frame right'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    cmd-left = 'workspace prev'
    cmd-right = 'workspace next'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'

    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'
 
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    alt-semicolon = 'mode service'

    alt-shift-c = 'exec-and-forget /Users/luke/.center-window.sh'


[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    # backspace = ['close-all-windows-but-current', 'mode main']

    alt-left = ['join-with left', 'mode main']
    alt-down = ['join-with down', 'mode main']
    alt-up = ['join-with up', 'mode main']
    alt-right = ['join-with right', 'mode main']
    

    

