                [comboMode.bindings.destination.bindings.destination.command]
                actionIdentifier = 'tuna.common-actions/run-text-as-shell-command'
                behavior = 'run'
                presentation = 'hidden'
                subjectIdentifiers = [
                    '''text:/usr/bin/osascript -e '-- Give Tuna time to dismiss and return focus to the file picker.
delay 0.25
tell application "System Events"
    repeat 30 times
        set frontAppID to bundle identifier of first application process whose frontmost is true
        if frontAppID is not "com.brnbw.Tuna" then exit repeat
        delay 0.1
    end repeat
    if frontAppID is "com.brnbw.Tuna" then error "The file picker did not regain focus."
    keystroke "g" using {command down, shift down}
    delay 0.4
    keystroke "a" using command down
    keystroke "/Users/luke"
    delay 0.15
    key code 36
end tell
''''
                ]
                type = 'savedCommand'

