subjectIdentifiers = ["text:/usr/bin/osascript -e 'tell application \"Ghostty\"\nnew window\nactivate\nend tell\n'"]
actionIdentifier = "tuna.common-actions/run-text-as-shell-command"
behavior = "run"
presentation = "hidden"

[[comboMode.bindings.destination.bindings]]
key = "h"
label = "Terminal here"
[comboMode.bindings.destination.bindings.destination]
type = "command"
[comboMode.bindings.destination.bindings.destination.command]
type = "savedCommand"
subjectIdentifiers = ["text:/usr/bin/osascript -e 'delay 0.25\ntell application \"System Events\"\n    repeat 30 times\n        set frontAppID to bundle identifier of first application process whose frontmost is true\n        if frontAppID is not \"com.brnbw.Tuna\" then exit repeat\n        delay 0.1\n    end repeat\nend tell\nif frontAppID is \"com.brnbw.Tuna\" then error \"The previous app did not regain focus.\"\nif frontAppID is \"com.microsoft.VSCode\" then\n    tell application \"System Events\"\n        keystroke \"g\" using {command down, control down, option down}\n    end tell\nelse\n    tell application \"Finder\"\n        if (count of Finder windows) is 0 then\n            display alert \"Open a Finder folder or a VS Code project first.\"\n            return\n        end if\n        try\n            set folderPath to POSIX path of (target of front Finder window as alias)\n        on error\n            display alert \"Choose a regular folder in Finder first.\" message \"This Finder view does not have a folder path.\"\n            return\n        end try\n    end tell\n    tell application \"Ghostty\"\n        set cfg to new surface configuration\n        set initial working directory of cfg to folderPath\n        new window with configuration cfg\n        activate\n    end tell\nend if\n'"]
actionIdentifier = "tuna.common-actions/run-text-as-shell-command"
behavior = "run"
presentation = "hidden"

