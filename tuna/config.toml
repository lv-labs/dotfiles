[[comboMode.bindings.destination.bindings]]
key = "h"
label = "Finder here"
[comboMode.bindings.destination.bindings.destination]
type = "command"
[comboMode.bindings.destination.bindings.destination.command]
type = "savedCommand"
subjectIdentifiers = ["text:/usr/bin/osascript -e 'delay 0.25\ntell application \"System Events\"\n    repeat 30 times\n        set frontAppID to bundle identifier of first application process whose frontmost is true\n        if frontAppID is not \"com.brnbw.Tuna\" then exit repeat\n        delay 0.1\n    end repeat\nend tell\nif frontAppID is \"com.mitchellh.ghostty\" then\n    tell application \"Ghostty\"\n        set term to focused terminal of selected tab of front window\n        set folderPath to working directory of term\n    end tell\n    if folderPath is \"\" then error \"Ghostty has not reported a working directory.\"\n    tell application \"Finder\"\n        make new Finder window to (POSIX file folderPath)\n        activate\n    end tell\nelse if frontAppID is \"com.microsoft.VSCode\" then\n    tell application \"System Events\"\n        keystroke \"f\" using {command down, control down, option down}\n    end tell\nelse if frontAppID is \"com.apple.finder\" then\n    tell application \"Finder\"\n        set folderPath to POSIX path of (target of front Finder window as alias)\n        make new Finder window to (POSIX file folderPath)\n        activate\n    end tell\nelse\n    display alert \"Finder Here works from Ghostty, VS Code, or Finder.\"\nend if\n'"]
actionIdentifier = "tuna.common-actions/run-text-as-shell-command"
behavior = "run"
presentation = "hidden"

